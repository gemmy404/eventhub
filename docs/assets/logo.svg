<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="roundedBg">
      <rect x="0" y="0" width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <!-- Flat background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#0F172A"/>

  <!-- Decorative flat circle accent, clipped to rounded corners -->
  <g clip-path="url(#roundedBg)">
    <circle cx="440" cy="80" r="140" fill="#F97316" opacity="0.12"/>
    <circle cx="60" cy="460" r="120" fill="#F97316" opacity="0.10"/>
  </g>

  <!-- Ticket shape, flat outline style -->
  <path d="
    M 116 196
    H 396
    a 24 24 0 0 1 24 24
    v 40
    a 28 28 0 0 0 0 56
    v 40
    a 24 24 0 0 1 -24 24
    H 116
    a 24 24 0 0 1 -24 -24
    v -40
    a 28 28 0 0 0 0 -56
    v -40
    a 24 24 0 0 1 24 -24
    Z"
    fill="#0F172A" stroke="#F97316" stroke-width="6"/>

  <!-- Perforation line -->
  <line x1="256" y1="212" x2="256" y2="300" stroke="#F97316" stroke-width="4" stroke-dasharray="8 8"/>

  <!-- Calendar mark, flat outline -->
  <g>
    <rect x="140" y="230" width="64" height="52" rx="8" fill="none" stroke="#F8FAFC" stroke-width="4"/>
    <line x1="140" y1="248" x2="204" y2="248" stroke="#F8FAFC" stroke-width="4"/>
    <line x1="154" y1="222" x2="154" y2="238" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round"/>
    <line x1="190" y1="222" x2="190" y2="238" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round"/>
    <circle cx="154" cy="264" r="3.5" fill="#F97316"/>
    <circle cx="172" cy="264" r="3.5" fill="#F8FAFC"/>
    <circle cx="190" cy="264" r="3.5" fill="#F8FAFC"/>
  </g>

  <!-- QR-style mark, flat outline -->
  <g fill="none" stroke="#F8FAFC" stroke-width="4">
    <rect x="292" y="228" width="20" height="20" rx="3"/>
    <rect x="326" y="228" width="20" height="20" rx="3"/>
    <rect x="292" y="262" width="20" height="20" rx="3"/>
  </g>
  <rect x="331" y="267" width="10" height="10" fill="#F97316"/>

  <!-- Wordmark -->
  <text x="256" y="368" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700"
        text-anchor="middle" fill="#F8FAFC" letter-spacing="1">Event<tspan fill="#F97316">Hub</tspan></text>
</svg>
